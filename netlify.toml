# Netlify configuration.
#
# Redirects live here rather than in next.config.ts because `next.config`
# redirects do not fire on a static export: the site is served as plain files
# from /out, so the CDN has to issue them.

# Retired URLs from the OBRA site. Both the slash and no-slash variants
# redirect permanently to their madebyobra equivalents.
[[redirects]]
  from = "/festival"
  to = "/festivals/"
  status = 301

[[redirects]]
  from = "/festival/"
  to = "/festivals/"
  status = 301

[[redirects]]
  from = "/custom-football-shirts-for-festivals"
  to = "/festivals/"
  status = 301

[[redirects]]
  from = "/custom-football-shirts-for-festivals/"
  to = "/festivals/"
  status = 301

[[redirects]]
  from = "/brief"
  to = "/start-a-project/"
  status = 301

[[redirects]]
  from = "/brief/"
  to = "/start-a-project/"
  status = 301
